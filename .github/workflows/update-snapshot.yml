name: Update Pages snapshot

on:
  workflow_dispatch: {}
  schedule:
    # Weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Export segments from DB
        run: |
          python3 tools/export_segments_from_db.py --db road_data.db --out frontend/segments.json

      - name: Show exported count
        run: |
          python3 - <<'PY'
import json
try:
    d=json.load(open('frontend/segments.json'))
    print('WROTE', len(d), 'rows')
except Exception as e:
    print('FAILED to read frontend/segments.json:', e)
    raise
PY

      - name: Commit and push snapshot to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/segments.json
          if git diff --staged --quiet; then
            echo "No changes to snapshot"
            exit 0
          fi
          git commit -m "Snapshot: update segments.json (action)"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:gh-pages
